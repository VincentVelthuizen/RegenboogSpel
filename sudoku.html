<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Sudoku</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sudoku.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>
<body>
  <a href="index.html" class="home-btn" aria-label="Terug naar menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5l-7 7 7 7" /></svg>
  </a>
  <main id="sudoku-game">
    <div id="su-menu" class="su-screen"></div>
    <div id="su-playing" class="su-screen hidden">
      <div id="su-toolbar"></div>
      <div id="su-board"></div>
      <div id="su-palette"></div>
    </div>
  </main>

  <div id="su-celebration" class="hidden" aria-hidden="true">
    <div id="su-confetti"></div>
    <div id="su-celebration-content"></div>
  </div>
</body>
</html>
